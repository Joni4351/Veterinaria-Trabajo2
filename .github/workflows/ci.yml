name: Build test and publish
on:
  push:
    branches: [main, master, 'feature/**', 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ephemeral test configuration
        shell: bash
        run: |
          value=$(openssl rand -base64 48)
          echo "::add-mask::$value"
          echo "Jwt__Key=$value" >> "$GITHUB_ENV"
          echo 'Jwt__Issuer=VeterinarioApi' >> "$GITHUB_ENV"
          echo 'Jwt__Audience=VeterinarioApiUsuarios' >> "$GITHUB_ENV"
      - run: dotnet restore VeterinariaAPI.Tests/VeterinariaAPI.Tests.csproj
      - run: dotnet test VeterinariaAPI.Tests/VeterinariaAPI.Tests.csproj -c Release --no-restore
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:facial:e2e
        working-directory: frontend
        env:
          CI: 'true'
  containers:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: local
      Demo__Enabled: 'true'
      Database__MigrateOnStartup: 'true'
      FRONTEND_PORT: '15174'
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated runtime secrets
        shell: bash
        run: |
          for name in Jwt__Key Biometrics__EncryptionKey SANDBOX_DB_PASSWORD; do
            value=$(openssl rand -base64 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start complete stack
        env:
          COMPOSE_PROFILES: local
          Demo__Enabled: 'true'
          Database__MigrateOnStartup: 'true'
          FRONTEND_PORT: '15174'
        run: docker compose -p vetclinic-ci up --build --detach --wait --wait-timeout 240
      - name: Readiness through reverse proxy
        run: curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:15174/health/api
      - name: Verify backup and restore on isolated database
        shell: pwsh
        run: ./scripts/Test-BackupRestore.ps1 -Project vetclinic-ci -EnvFile ''
      - name: Stop isolated stack
        if: always()
        run: docker compose -p vetclinic-ci down --volumes
  publish:
    needs: [backend, frontend, containers]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'api' && './VeterinariaAPI' || './frontend' }}
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repository }}/${{ matrix.service }}:${{ github.sha }}
